name: CGV watch

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분 간격 (UTC 기준, 지연될 수 있음)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cgv-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python watcher.py

      - name: Persist notified state
        run: |
          if ! git diff --quiet notified.json 2>/dev/null; then
            git config user.name "cgv-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add notified.json
            git commit -m "chore: update notified state [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
