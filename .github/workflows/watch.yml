name: CGV watch

on:
  # 주 트리거: Apps Script(CGV_Dispatch.gs)가 10분마다 workflow_dispatch 호출.
  # schedule은 GitHub 쪽 큐 지연으로 실제 2~5시간 간격으로만 돌아 백업용으로만 유지.
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: cgv-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python watcher.py

      - name: Persist notified state
        run: |
          if ! git diff --quiet notified.json 2>/dev/null; then
            git config user.name "cgv-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add notified.json
            git commit -m "chore: update notified state [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
